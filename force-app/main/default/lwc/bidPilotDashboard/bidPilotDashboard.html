<template>
    <div class="bp">
        <template lwc:if={error}>
            <div class="error">{error}</div>
        </template>

        <template lwc:if={showSpinner}>
            <div class="loading"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
        </template>

        <template lwc:if={hasData}>
            <!-- ================= HERO ================= -->
            <div class="hero">
                <div class="hero-top">
                    <div class="hero-left">
                        <div class="brand">
                            <span class="brand-mark">✈</span> BidPilot
                            <span class="live"><span class="dot"></span>Live</span>
                            <template lwc:if={isWorking}>
                                <span class="working"><span class="pulse-ring"></span>Agent working…</span>
                            </template>
                        </div>
                        <div class="title">{data.projectTitle}</div>
                        <div class="subtitle">
                            <span>{data.clientName}</span><span class="sep">•</span>
                            <span>{data.bidNumber}</span><span class="sep">•</span>
                            <span>{requestedText}</span>
                        </div>
                    </div>
                    <div class="hero-right">
                        <div class={statusClass}>{data.status}</div>
                        <div class="progress-label">{progressText}</div>
                        <div class="progress"><div class="progress-fill" style={progressStyle}></div></div>
                    </div>
                </div>
                <template lwc:if={hasTech}>
                    <div class="tech">
                        <template for:each={techChips} for:item="t">
                            <span key={t.key} class="tech-chip">{t.label}</span>
                        </template>
                    </div>
                </template>
            </div>

            <!-- last agent event -->
            <template lwc:if={hasEvent}>
                <div class="event">
                    <span class="event-icon">⚡</span>
                    <span class="event-text">{lastEvent}</span>
                    <span class="event-time">{eventAgo}</span>
                </div>
            </template>

            <!-- ================= STEPS ================= -->
            <div class="steps">
                <template for:each={steps} for:item="s">
                    <div key={s.key} class={s.cls}>
                        <div class="step-num">{s.num}</div>
                        <div class="step-label">{s.label}</div>
                    </div>
                </template>
            </div>

            <!-- ================= DOCUMENTS ================= -->
            <div class="docs">
                <div class="doc-card">
                    <div class="doc-icon i-blue">📄</div>
                    <div class="doc-info">
                        <div class="doc-title">Statement of Work</div>
                        <div class="doc-main">{sowText}</div>
                        <div class="doc-sub">{sowSub}</div>
                    </div>
                    <iframe src={uploadUrl} class="upload-frame" title="Upload SOW PDF"></iframe>
                </div>
                <div class="doc-card">
                    <div class="doc-icon i-violet">📑</div>
                    <div class="doc-info">
                        <div class="doc-title">Proposal PDF</div>
                        <div class="doc-main">Client-ready document</div>
                        <div class="doc-sub">{pdfSub}</div>
                    </div>
                    <div class="doc-btns">
                        <lightning-button label="Download" icon-name="utility:download" onclick={downloadPdf} disabled={pdfDisabled}></lightning-button>
                        <lightning-button variant="brand" label="Save to Files" icon-name="utility:file" onclick={savePdf} disabled={pdfDisabled}></lightning-button>
                    </div>
                </div>
            </div>

            <!-- ================= KPIs ================= -->
            <div class="kpis">
                <div class={hoursCls}>
                    <div class="kpi-head"><span class="kpi-icon i-blue">⏱</span><span class="kpi-label">Total effort</span></div>
                    <template lwc:if={hasHours}>
                        <div class="kpi-value">{hoursText}<span class="unit">hrs</span></div>
                    </template>
                    <template lwc:else><div class="kpi-empty">Awaiting estimate</div></template>
                    <div class="kpi-sub">{calibrationText}</div>
                </div>

                <div class={costCls}>
                    <div class="kpi-head"><span class="kpi-icon i-green">₹</span><span class="kpi-label">Investment</span></div>
                    <template lwc:if={hasCost}>
                        <div class="kpi-value">{costText}</div>
                    </template>
                    <template lwc:else><div class="kpi-empty">Awaiting estimate</div></template>
                    <div class="kpi-sub">{costSub}</div>
                </div>

                <div class={weeksCls}>
                    <div class="kpi-head"><span class="kpi-icon i-amber">📅</span><span class="kpi-label">Duration</span></div>
                    <template lwc:if={hasWeeks}>
                        <div class="kpi-value">{weeksText}<span class="unit">wks</span></div>
                    </template>
                    <template lwc:else><div class="kpi-empty">Awaiting estimate</div></template>
                    <template lwc:if={showTimelineBar}>
                        <div class="tl">
                            <div class="tl-row"><span class="tl-key">Asked</span><div class="tl-track"><div class="tl-fill tl-ask" style={requestedBarStyle}></div></div></div>
                            <div class="tl-row"><span class="tl-key">Plan</span><div class="tl-track"><div class={estimatedBarCls} style={estimatedBarStyle}></div></div></div>
                        </div>
                    </template>
                    <div class={weeksSubCls}>{weeksSub}</div>
                </div>

                <div class={teamCls}>
                    <div class="kpi-head"><span class="kpi-icon i-violet">👥</span><span class="kpi-label">Team</span></div>
                    <template lwc:if={hasTeam}>
                        <div class="kpi-value">{teamCount}<span class="unit">people</span></div>
                    </template>
                    <template lwc:else><div class="kpi-empty">Not staffed yet</div></template>
                    <div class={teamSubCls}>{teamSub}</div>
                </div>
            </div>

            <div class="grid">
                <!-- ================= RISK ================= -->
                <div class={riskCardCls}>
                    <div class="card-title">Risk assessment <span class={riskPillCls}>{riskLevelText}</span></div>
                    <div class="gauge">
                        <svg viewBox="0 0 200 115" class="gauge-svg">
                            <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#eceef3" stroke-width="16" stroke-linecap="round"></path>
                            <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke={riskColor} stroke-width="16"
                                stroke-linecap="round" stroke-dasharray={riskDash} class="gauge-fill"></path>
                            <text x="100" y="90" text-anchor="middle" class="gauge-num">{riskScoreText}</text>
                            <text x="100" y="108" text-anchor="middle" class="gauge-cap">out of 100</text>
                        </svg>
                    </div>

                    <template lwc:if={hasRisk}>
                        <div class="reasons">
                            <template for:each={riskReasons} for:item="r">
                                <div key={r.key} class="reason">
                                    <span class="reason-text">{r.text}</span>
                                    <span class="reason-pts">{r.pts}</span>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template lwc:elseif={hasSowRisks}>
                        <div class="mini-title">Risks found in the SOW</div>
                        <ul class="sow-risks">
                            <template for:each={sowRisks} for:item="r">
                                <li key={r.key}>{r.text}</li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <div class="empty small">Risk is scored after the team is staffed.</div>
                    </template>

                    <template lwc:if={isPending}>
                        <div class="approval">
                            <div class="approval-title">⚠ Manager approval required</div>
                            <lightning-textarea label="Comments" variant="label-hidden" placeholder="Conditions or reason (optional)"
                                value={comments} onchange={handleComments}></lightning-textarea>
                            <div class="approval-actions">
                                <lightning-button variant="destructive-text" label="Reject" onclick={handleReject} disabled={busy}></lightning-button>
                                <lightning-button variant="brand" label="Approve" onclick={handleApprove} disabled={busy}></lightning-button>
                            </div>
                        </div>
                    </template>
                    <template lwc:if={data.approvalComments}>
                        <div class="approval-note">{data.approvalComments}</div>
                    </template>
                </div>

                <!-- ================= MODULES ================= -->
                <div class={modulesCls}>
                    <div class="card-title">
                        Scope modules
                        <template lwc:if={hasModules}>
                            <template for:each={complexityMix} for:item="c">
                                <span key={c.key} class={c.cls}>{c.label}</span>
                            </template>
                        </template>
                    </div>
                    <template lwc:if={hasModules}>
                        <div class="modules">
                            <template for:each={modules} for:item="m">
                                <div key={m.id} class="module">
                                    <div class="module-head">
                                        <span class="module-name">{m.name}</span>
                                        <span class={m.badge}>{m.complexity}</span>
                                        <span class="module-skill">{m.skill}</span>
                                        <span class="module-hours">{m.hoursText}</span>
                                    </div>
                                    <div class="bar"><div class={m.barCls} style={m.barStyle}></div></div>
                                    <template lwc:if={m.description}>
                                        <div class="module-desc">{m.description}</div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="empty">
                            <div class="empty-icon">📄</div>
                            <div>Ask BidPilot to analyse this SOW.</div>
                            <div class="hint">“Analyse the SOW for {data.bidNumber} and prepare the bid”</div>
                        </div>
                    </template>
                    <template lwc:if={hasSimilar}>
                        <div class="similar">
                            <div class="mini-title">Calibrated against past projects</div>
                            <template for:each={similar} for:item="s">
                                <div key={s.key} class="similar-row">{s.text}</div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>

            <!-- ================= TEAM ================= -->
            <div class="card">
                <div class="card-title">Suggested team
                    <template lwc:if={hasTeam}><span class="team-total">Total {teamTotal}</span></template>
                </div>
                <template lwc:if={hasTeam}>
                    <div class="team">
                        <template for:each={team} for:item="t">
                            <div key={t.id} class={t.cardCls}>
                                <div class="avatar">{t.initials}</div>
                                <div class="member-info">
                                    <div class="member-name">{t.displayName}</div>
                                    <div class="member-role">{t.role}</div>
                                    <div class="member-skill">{t.skill}</div>
                                    <div class="alloc"><div class="alloc-fill" style={t.allocStyle}></div></div>
                                    <div class="member-meta"><span>{t.allocText} · {t.hoursText}</span><span class="member-cost">{t.costText}</span></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <div class="empty small">The team is matched on skills and availability after estimation.</div>
                </template>
            </div>

            <!-- ================= PROPOSAL ================= -->
            <template lwc:if={hasProposal}>
                <div class="card">
                    <div class="doc-head">
                        <div class="tabs">
                            <button class={proposalTabCls} onclick={showProposal}>Proposal</button>
                            <button class={emailTabCls} onclick={showEmail}>Client email</button>
                        </div>
                        <div class="doc-actions">
                            <template lwc:if={hasOpportunity}>
                                <lightning-button label="Open Opportunity" icon-name="standard:opportunity" onclick={openOpportunity}></lightning-button>
                            </template>
                            <lightning-button label="Copy" icon-name="utility:copy" onclick={copyDoc}></lightning-button>
                        </div>
                    </div>
                    <pre class="doc">{docText}</pre>
                </div>
            </template>
        </template>
    </div>
</template>
